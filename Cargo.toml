[package]
name = "ruffle-dragonfable"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "itmr-dragonfable-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
async-task = "4.7.1"
dirs = "6.0.0"
dragonfable-cache = { version = "0.1.0", path = "../df-cache-layer" }
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
fontdb = "0.24.0"
futures = "0.3.34"
ruffle_core = { version = "0.4.1", path = "../ruffle/core", features = ["audio", "mp3", "aac", "nellymoser", "lzma", "default_compatibility_rules"] }
ruffle_frontend_utils = { version = "0.4.1", path = "../ruffle/frontend-utils", features = ["cpal", "fs", "navigator"] }
ruffle_render_wgpu = { version = "0.4.1", path = "../ruffle/render/wgpu" }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
ruffle_video_software = { version = "0.4.1", path = "../ruffle/video/software" }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webbrowser = "1.2.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "27"
winit = "0.30"

# The in-tree swf fork must be used everywhere, so no dependency pulls the
# crates.io copy (which would cause type mismatches).
[patch.crates-io]
swf = { path = "../ruffle/swf" }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
