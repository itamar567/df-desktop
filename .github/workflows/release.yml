name: Release

# Builds distributable artifacts for tagged releases (and manual runs).
# The tag must match the version in Cargo.toml; the check below enforces it,
# since the in-app update notifier compares against CARGO_PKG_VERSION.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN: itmr-dragonfable-launcher
  # Must stay in sync with the sibling path dependencies in Cargo.toml.
  RUFFLE_REPO: itamar567/ruffle-df
  CACHE_REPO: itamar567/df-ruffle-cache-layer

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: itmr-dragonfable-launcher-x86_64.AppImage
          - os: windows-latest
            artifact: itmr-dragonfable-launcher-x86_64.exe
    steps:
      - name: Check out launcher
        uses: actions/checkout@v4
        with:
          path: desktop

      - name: Check out ruffle fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUFFLE_REPO }}
          path: ruffle
          # The ruffle fork is private
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Check out cache layer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CACHE_REPO }}
          path: df-cache-layer

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi

      - name: Build
        working-directory: desktop
        run: cargo build --release

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin
          cp desktop/target/release/${BIN} AppDir/usr/bin/
          curl -sL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file desktop/packaging/${BIN}.desktop \
            --icon-file desktop/packaging/${BIN}.png \
            --output appimage
          mv ./*.AppImage "${artifact}" 2>/dev/null || true
          [ -f "${artifact}" ] || mv "$(find . -maxdepth 1 -name '*AppImage' ! -name 'linuxdeploy*' | head -1)" "${artifact}"
        env:
          artifact: ${{ matrix.artifact }}

      - name: Collect Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: cp desktop/target/release/${BIN}.exe "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BIN }}-x86_64.AppImage
            ${{ env.BIN }}-x86_64.exe
